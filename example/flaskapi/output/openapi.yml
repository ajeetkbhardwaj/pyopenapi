openapi: 3.0.3
info:
  title: flaskapi API
  version: 0.1.0
  description: OpenAPI specification generated statically from flask sources in flaskapi.
paths:
  /health:
    get:
      operationId: get_health
      tags:
      - health
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: health
  /api/items:
    get:
      operationId: get_api_items
      tags:
      - api
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: list_items
    post:
      operationId: post_api_items
      tags:
      - api
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: create_item
  /api/items/{item_id}:
    get:
      operationId: get_api_items_item_id
      tags:
      - api
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: get_item
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: put_api_items_item_id
      tags:
      - api
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: update_item
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
    delete:
      operationId: delete_api_items_item_id
      tags:
      - api
      responses:
        '204':
          description: Successful response
      summary: delete_item
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
  /api/users/{user_id}:
    get:
      operationId: get_api_users_user_id
      tags:
      - api
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: get_user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
  /api/users/{user_id}/orders:
    get:
      operationId: get_api_users_user_id_orders
      tags:
      - api
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: list_user_orders
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
components:
  schemas:
    ItemStatus:
      type: string
      enum:
      - draft
      - active
      - archived
    ItemCreate:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
          format: float
        status:
          $ref: '#/components/schemas/ItemStatus'
        tags:
          type: array
          items:
            type: string
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        full_name:
          type: string
          nullable: true
        is_active:
          type: boolean
      required:
      - id
      - email
    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        item_ids:
          type: array
          items:
            type: integer
        total:
          type: number
          format: float
        note:
          type: string
          nullable: true
      required:
      - id
      - user_id
      - item_ids
      - total

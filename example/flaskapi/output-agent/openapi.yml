openapi: 3.0.3
info:
  title: Flask API
  version: 0.1.0
  description: A Flask-based API providing CRUD operations for items and user-related
    endpoints including orders and health checks.
paths:
  /api/items:
    get:
      operationId: get_api_items
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: List all items
      description: Retrieves a list of all available items from the collection. Returns
        an array of item objects with their associated metadata.
      tags:
      - api
    post:
      operationId: post_api_items
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: Create a new item
      description: Creates a new item in the collection. The request body should contain
        the item data including required fields for the new item.
      tags:
      - api
  /api/items/{item_id}:
    delete:
      operationId: delete_api_items_item_id
      responses:
        '204':
          description: No content
      summary: Delete an item
      description: Removes the specified item from the collection. Returns 204 No
        Content on success.
      tags:
      - api
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: get_api_items_item_id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: Retrieve an item
      description: Returns the details of the specified item. Use this endpoint to
        fetch a single item by its unique identifier.
      tags:
      - api
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: put_api_items_item_id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: Update an item
      description: Updates the specified item with new data. Returns the updated item
        on success.
      tags:
      - api
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
  /api/users/{user_id}:
    get:
      operationId: get_api_users_user_id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: Retrieve a user by ID
      description: Returns the details of a specific user identified by the user_id
        path parameter.
      tags:
      - Users
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
  /api/users/{user_id}/orders:
    get:
      operationId: get_api_users_user_id_orders
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: List all orders for a specific user
      description: Retrieves a paginated list of orders associated with the specified
        user ID. Returns order details including order ID, items, total amount, and
        status.
      tags:
      - api
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
  /health:
    get:
      operationId: get_health
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      summary: Health check
      description: Returns the health status of the service. Use this endpoint to
        verify that the API is operational and responding to requests.
      tags:
      - health
components:
  schemas:
    ItemStatus:
      type: string
      enum:
      - draft
      - active
      - archived
      description: Enumeration representing the status of an item in the system. Defines
        the possible states an item can be in, such as draft, active, or archived.
    ItemCreate:
      type: object
      properties:
        name:
          type: string
          description: The name or title of the item being created. This field is
            optional but recommended for identifying the item.
          example: Laptop
        price:
          type: number
          format: float
          description: The price of the item as a floating-point number. Represents
            the cost in the system's default currency.
          example: 999.99
        status:
          allOf:
          - $ref: '#/components/schemas/ItemStatus'
          description: The current status of the item, represented by an ItemStatus
            object. Indicates the item's state in the system.
          example: active
        tags:
          type: array
          items:
            type: string
          description: An array of string tags for categorizing or labeling the item.
            Useful for filtering and searching items.
          example:
          - electronics
          - sale
          - featured
      description: Pydantic model for creating a new item in the system. This model
        defines the structure and validation rules for item creation requests.
    User:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the user
          example: 1
        email:
          type: string
          description: Email address of the user
          example: user@example.com
        full_name:
          type: string
          nullable: true
          description: Full name of the user, can be null if not provided
          example: John Doe
        is_active:
          type: boolean
          description: Indicates whether the user account is active
          example: true
      required:
      - id
      - email
      description: User model representing a user entity in the system.
    Order:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the order.
          example: 1
        user_id:
          type: integer
          description: Identifier of the user who placed the order.
          example: 42
        item_ids:
          type: array
          items:
            type: integer
          description: List of item identifiers included in the order.
          example:
          - 1
          - 2
          - 3
        total:
          type: number
          format: float
          description: Total cost of the order.
          example: 99.99
        note:
          type: string
          nullable: true
          description: Optional note or special instructions for the order.
          example: Leave at the door
      required:
      - id
      - user_id
      - item_ids
      - total
      description: Represents an order placed by a user in the system.
tags:
- name: api
- name: health

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]" -e "./router"
      - run: ruff check src router/src tests router/tests
      - run: pytest -q tests
      - run: pytest -q router/tests
      - name: Build wheel
        run: python -m pip install build && python -m build --wheel
      - name: Smoke test wheel install
        run: |
          pip install dist/*.whl
          python -c "import pyopenapi; from importlib.resources import files; t = files('pyopenapi.templates.stats'); assert set(f.name for f in t.iterdir()) == {'dashboard.css', 'dashboard.html', 'dashboard.js'}"

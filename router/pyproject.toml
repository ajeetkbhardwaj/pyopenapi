[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "router"
version = "0.1.0"
description = "NVIDIA free-endpoint router for mini-pi (curated registry, speed+accuracy routing, chat service, optional LiteLLM config)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
litellm = [
    "litellm>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
router = "router.cli:main"
mini-router = "router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/router"]

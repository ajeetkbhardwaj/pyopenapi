litellm_settings:
  num_retries: 3
  request_timeout: 30
  drop_params: true
  fallbacks:
  - nvidia-coding:
    - nvidia-agents
    - nvidia-reasoning
  - nvidia-agents:
    - nvidia-coding
    - nvidia-reasoning
  - nvidia-reasoning:
    - nvidia-agents
    - nvidia-coding
router_settings:
  routing_strategy: latency-based-routing
  num_retries: 3
  cooldown_time: 60
  allowed_fails: 2
  enable_pre_call_checks: true

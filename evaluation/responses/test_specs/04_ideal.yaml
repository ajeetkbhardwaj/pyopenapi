openapi: 3.0.0
info: {title: Ref and AllOf Ideal, version: 1.0}
components:
  schemas:
    BaseSuccess: { type: object, properties: { success: { type: boolean } } }
    User: { type: object, properties: { id: { type: integer }, name: { type: string } } }
paths:
  /user/{id}:
    get:
      responses:
        '200':
          description: A user response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseSuccess'
                  - $ref: '#/components/schemas/User'
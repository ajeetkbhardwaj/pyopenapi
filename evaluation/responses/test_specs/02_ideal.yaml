openapi: 3.0.0
info: {title: Simple Mismatch Ideal, version: 1.0}
paths:
  /user:
    get:
      responses:
        '200':
          description: A user object
          content:
            application/json:
              schema:
                type: object
                required: [id, name, email]
                properties:
                  id: { type: integer, format: int64 }
                  name: { type: string, minLength: 2 }
                  email: { type: string, format: email }
openapi: 3.0.0
info: {title: Array of Refs Test, version: 1.0}
components:
  schemas:
    Tag: { type: object, properties: { tagId: { type: integer }, tagName: { type: string } } } # Missing maxLength
paths:
  /tags:
    get:
      responses:
        '200':
          description: A list of tags
          content:
            application/json:
              schema:
                type: array
                # minItems is missing
                items:
                  $ref: '#/components/schemas/Tag'
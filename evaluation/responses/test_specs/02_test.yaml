openapi: 3.0.0
info: {title: Simple Mismatch Test, version: 1.0}
paths:
  /user:
    get:
      responses:
        '200':
          description: A user object
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: integer, format: int64 }
                  name: { type: string, minLength: 5 } # Mismatched constraint
                  username: { type: string }            # Extra parameter
                  # 'email' parameter is missing